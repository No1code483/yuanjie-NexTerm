# 内核插件默认权限集（capabilities 中引用 "kernel:default"）
# allow-kernel-dispatch 由 build.rs 依据 COMMANDS 自动生成于 permissions/autogenerated/
"$schema" = "schemas/schema.json"

[default]
description = "内核插件默认权限：允许前端调用统一 IPC 分发命令 kernel_dispatch（含内核保留命令 get_enabled/set_enabled/startup_report）"
permissions = ["allow-kernel-dispatch"]
